build-linux-aarch64:
  image: docker:28
  stage: build
  tags:
    - linux
    - aarch64
  variables:
    CMAKE_ARGS: "${CMAKE_ARGS}"
    TARGZ_FILE: "${LINUX_ARM64_TGZ}"
    CPU_ARCHTARGET: "armv8-a+crypto"
  before_script:
    - until docker info; do sleep 1; done
    - chmod +x *.sh
    - ls -la *.sh
    - apk add bash
  script:
    - docker buildx ls
    #- docker buildx build --platform=linux/arm64 --build-arg PACKAGE_VERSION=${PACKAGE_VERSION} --build-arg TARGZ_FILE=${LINUX_ARM64_TGZ} --build-arg CMAKE_ARGS=${CMAKE_ARGS} -f docker/Dockerfile.ubu . --output ./
    - bash -c "./go-docker.sh arm64"
  after_script:
    - echo "LINUX_ARM64_BUILD_JOB_ID=$CI_JOB_ID" >> linux-arm64-job.env
  artifacts:
    name: ${LINUX_ARM64_TGZ}
    paths:
      - ${LINUX_ARM64_TGZ}
    reports:
      dotenv: linux-arm64-job.env
  services:
    - name: docker:24.0.5-dind

build-macos-aarch64:
  extends:
    - .macos_saas_runners
  stage: build
  rules:
    - if: $CI_COMMIT_TAG || $TNN_BUILD_MAC == "true" 
  variables:
    TARGZ_FILE: "${MACOS_ARM64_TGZ}"
  script:
    - mkdir -p build
    - cd build
    - cmake -DTNN_VERSION=${PACKAGE_VERSION} ${CMAKE_ARGS} ..
    - make -j$(sysctl -n hw.logicalcpu)
    - cd ..
    - mv ./build/bin/tnn-miner-cpu ./tnn-miner
    - "[ -d ./build/bin/tunes ] && cp -r ./build/bin/tunes ./tunes || true"
    - tar -czvf ${TARGZ_FILE} ./tnn-miner ./tunes
  after_script:
    - echo "MACOS_BUILD_JOB_ID=$CI_JOB_ID" >> macos-arm64-job.env
  artifacts:
    name: ${MACOS_ARM64_TGZ}
    paths:
      - ${MACOS_ARM64_TGZ}
    reports:
      dotenv: macos-arm64-job.env

# run tests using the binary built before
test-linux-amd64:
  #rules:
  #  - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  stage: test
  needs:
    - job: build-linux-amd64
      artifacts: true
  tags:
    - linux
    - amd64
  before_script:
    - ls -la ./
  script:
    - tar -xvf ./${LINUX_AMD64_TGZ}
    - ./tnn-miner-cpu --test-dero --quiet
    - ./tnn-miner-cpu --test-spectre --quiet
    - ./tnn-miner-cpu --test-xelis --quiet
    
# run tests using the binary built before
test-linux-aarch64:
  #rules:
  #  - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  stage: test
  needs:
    - job: build-linux-aarch64
      artifacts: true
  tags:
    - linux
    - aarch64
  before_script:
    - ls -la ./
  script:
    - tar -xvf ./${LINUX_ARM64_TGZ}
    - ./tnn-miner-cpu --test-dero --quiet
    - ./tnn-miner-cpu --test-spectre --quiet
    - ./tnn-miner-cpu --test-xelis --quiet

# run tests using the binary built before
test-macos-aarch64:
  extends:
    - .macos_saas_runners
  stage: test
  rules:
    - if: $CI_COMMIT_TAG || $TNN_BUILD_MAC == "true"
  needs:
    - job: build-macos-aarch64
      artifacts: true
  script:
    - tar -xvf ./${MACOS_ARM64_TGZ}
    - ./tnn-miner --test-dero --quiet
    - ./tnn-miner --test-spectre --quiet
    - ./tnn-miner --test-xelis --quiet

# shellcheck + structural validation for mining OS wrappers
test-wrappers:
  stage: test
  needs: []
  tags:
    - linux
    - amd64
  image: docker:28
  before_script:
    - apk add --no-cache bash shellcheck
  script:
    - echo "=== Shellcheck ==="
    - shellcheck -s bash wrappers/hiveos+mmpos/tnn-miner/*.sh
    - shellcheck -s bash wrappers/hiveos+mmpos-amd/tnn-miner-rocm/*.sh
    - shellcheck -s bash wrappers/hiveos+mmpos-nvidia/tnn-miner-cuda/*.sh
    - echo "=== Structure checks ==="
    - |
      fail=0
      for variant in \
        "hiveos+mmpos:tnn-miner:tnn-miner" \
        "hiveos+mmpos-amd:tnn-miner-rocm:tnn-miner-rocm" \
        "hiveos+mmpos-nvidia:tnn-miner-cuda:tnn-miner-cuda"; do
        IFS=: read -r dir sub miner <<< "$variant"
        base="wrappers/$dir/$sub"
        echo "--- Checking $base ---"
        for f in h-run.sh h-config.sh h-stats.sh h-manifest.conf mmp-launch.sh mmp-stats.sh mmp-external.conf; do
          if [ ! -f "$base/$f" ]; then
            echo "MISSING: $base/$f"
            fail=1
          fi
        done
        # mmp-launch.sh must reference the correct binary
        if ! grep -q "$miner" "$base/mmp-launch.sh"; then
          echo "FAIL: mmp-launch.sh does not reference $miner"
          fail=1
        fi
        # h-manifest.conf must set MINER_NAME
        if ! grep -q "^MINER_NAME=" "$base/h-manifest.conf"; then
          echo "FAIL: h-manifest.conf missing MINER_NAME"
          fail=1
        fi
        # mmp-external.conf must have EXTERNAL_NAME and EXTERNAL_VERSION
        if ! grep -q "^EXTERNAL_NAME=" "$base/mmp-external.conf"; then
          echo "FAIL: mmp-external.conf missing EXTERNAL_NAME"
          fail=1
        fi
        if ! grep -q "^EXTERNAL_VERSION=" "$base/mmp-external.conf"; then
          echo "FAIL: mmp-external.conf missing EXTERNAL_VERSION"
          fail=1
        fi
      done
      if [ $fail -ne 0 ]; then
        echo "Wrapper validation FAILED"
        exit 1
      fi
      echo "All wrapper checks passed"

