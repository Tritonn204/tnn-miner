stages:
  - build
  - wrap
  - test
  - release

variables:
  RUNNER_SCRIPT_TIMEOUT: 40m
  DOCKER_TLS_CERTDIR: "/certs"
  TNN_BUILD_MAC: true
  TNN_BUILD_WIN: true
  PACKAGE_VERSION: "0.0.1"
  CMAKE_ARGS: "-DWITH_HIP=OFF"
  LINUX_AMD64_TGZ: "Tnn-miner-amd64-${PACKAGE_VERSION}.tar.gz"
  LINUX_ARM64_TGZ: "Tnn-miner-arm64-${PACKAGE_VERSION}.tar.gz"
  MACOS_ARM64_TGZ: "Tnn-miner-macos-arm64-${PACKAGE_VERSION}.tar.gz"
  WRAPPER_TEMP: "wrapper.tar.gz"
  WIN_AMD64_ZIP: "Tnn-miner-win64-${PACKAGE_VERSION}.zip"
  WIN_HIP_AMD_ZIP: "Tnn-miner-rocm-win64-${PACKAGE_VERSION}.zip"
  WIN_HIP_NVIDIA_ZIP: "Tnn-miner-cuda-win64-${PACKAGE_VERSION}.zip"
  LINUX_HIP_AMD_TGZ: "Tnn-miner-rocm-amd64-${PACKAGE_VERSION}.tar.gz"
  LINUX_HIP_NVIDIA_TGZ: "Tnn-miner-cuda-amd64-${PACKAGE_VERSION}.tar.gz"
  HIVEOS_MMPOS_HIP_AMD_TGZ: "Tnn-miner-hiveos_mmpos_hip-amd_${PACKAGE_VERSION}.tar.gz"
  HIVEOS_MMPOS_HIP_NVIDIA_TGZ: "Tnn-miner-hiveos_mmpos_hip-nvidia_${PACKAGE_VERSION}.tar.gz"
  # https://docs.gitlab.com/ee/ci/runners/hosted_runners/macos.html#optimizing-homebrew
  HOMEBREW_NO_AUTO_UPDATE: 1
  #CI_DEBUG_TRACE: "true"

# global workflow:rules:variables can change variables outside of jobs
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "cross_compile"
    # if the pipeline is executing because of a tag, then change the variables for a 
    - if: $CI_COMMIT_TAG
      variables:
        PACKAGE_VERSION: $CI_COMMIT_TAG
        LINUX_AMD64_TGZ: "Tnn-miner-amd64-${PACKAGE_VERSION}.tar.gz"
        LINUX_ARM64_TGZ: "Tnn-miner-arm64-${PACKAGE_VERSION}.tar.gz"
        MACOS_ARM64_TGZ: "Tnn-miner-macos-arm64-${PACKAGE_VERSION}.tar.gz"
        WRAPPER_TEMP: "wrapper.tar.gz"
        WIN_AMD64_ZIP: "Tnn-miner-win64-${PACKAGE_VERSION}.zip"
        WIN_HIP_AMD_ZIP: "Tnn-miner-rocm-win64-${PACKAGE_VERSION}.zip"
        WIN_HIP_NVIDIA_ZIP: "Tnn-miner-cuda-win64-${PACKAGE_VERSION}.zip"
        LINUX_HIP_AMD_TGZ: "Tnn-miner-rocm-amd64-${PACKAGE_VERSION}.tar.gz"
        LINUX_HIP_NVIDIA_TGZ: "Tnn-miner-cuda-amd64-${PACKAGE_VERSION}.tar.gz"
        HIVEOS_MMPOS_HIP_AMD_TGZ: "Tnn-miner-hiveos_mmpos_hip-amd_${PACKAGE_VERSION}.tar.gz"
        HIVEOS_MMPOS_HIP_NVIDIA_TGZ: "Tnn-miner-hiveos_mmpos_hip-nvidia_${PACKAGE_VERSION}.tar.gz"

.macos_saas_runners:
  tags:
    - macos-aarch64
  image: macos-15-xcode-16
  before_script:
    - echo "started by ${GITLAB_USER_NAME} / @${GITLAB_USER_LOGIN}"
    - brew install llvm@18
    - export PATH="/opt/homebrew/opt/llvm@18/bin:$PATH"
    - which clang
    - clang --version

.windows_job:
  tags:
    - saas-windows-medium-amd64
  before_script:
    - Set-Variable -Name "time" -Value (date -Format "%H:%m")
    - echo ${time}
    - echo "started by ${GITLAB_USER_NAME} / @${GITLAB_USER_LOGIN}"

build-linux-amd64:
  image: docker:28
  stage: build
  tags:
    - linux
    - amd64
  variables:
    CMAKE_ARGS: "${CMAKE_ARGS}"
    TARGZ_FILE: "${LINUX_AMD64_TGZ}"
  before_script:
    - until docker info; do sleep 1; done
    - chmod +x *.sh
    - ls -la *.sh
    - apk add bash
  script:
    #- docker buildx build --platform=linux/amd64 --build-arg PACKAGE_VERSION=${PACKAGE_VERSION} --build-arg TARGZ_FILE=${LINUX_AMD64_TGZ} --build-arg CMAKE_ARGS=${CMAKE_ARGS} -f docker/Dockerfile.ubu . --output ./
    - bash -c "./go-docker.sh amd64"
    - export HIVEOS_MMPOS_AMD64_TGZ="tnn-miner-hiveos_mmpos_amd64_${PACKAGE_VERSION//-/.}.tar.gz"
    - echo "HIVEOS_MMPOS_AMD64_TGZ=$HIVEOS_MMPOS_AMD64_TGZ" >> linux-amd64-job.env
  after_script:
    - echo "LINUX_AMD64_BUILD_JOB_ID=$CI_JOB_ID" >> linux-amd64-job.env
  artifacts:
    name: ${LINUX_AMD64_TGZ}
    paths:
      - ${LINUX_AMD64_TGZ}
    reports:
      dotenv: linux-amd64-job.env
  services:
    - name: docker:24.0.5-dind

build-linux-amd64-hip-amd:
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
  image: docker:28
  stage: build
  tags:
    - linux
    - amd64
  variables:
    TARGZ_FILE: "${LINUX_HIP_AMD_TGZ}"
  before_script:
    - until docker info; do sleep 1; done
    - chmod +x *.sh
    - apk add bash
  script:
    - bash -c "./go-docker.sh amd"
  after_script:
    - echo "LINUX_HIP_AMD_BUILD_JOB_ID=$CI_JOB_ID" >> linux-hip-amd-job.env
  artifacts:
    name: ${LINUX_HIP_AMD_TGZ}
    paths:
      - ${LINUX_HIP_AMD_TGZ}
    reports:
      dotenv: linux-hip-amd-job.env
  services:
    - name: docker:24.0.5-dind

build-linux-amd64-hip-nvidia:
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
  image: docker:28
  stage: build
  tags:
    - linux
    - amd64
  variables:
    TARGZ_FILE: "${LINUX_HIP_NVIDIA_TGZ}"
  before_script:
    - until docker info; do sleep 1; done
    - chmod +x *.sh
    - apk add bash
  script:
    - bash -c "./go-docker.sh nvidia"
  after_script:
    - echo "LINUX_HIP_NVIDIA_BUILD_JOB_ID=$CI_JOB_ID" >> linux-hip-nvidia-job.env
  artifacts:
    name: ${LINUX_HIP_NVIDIA_TGZ}
    paths:
      - ${LINUX_HIP_NVIDIA_TGZ}
    reports:
      dotenv: linux-hip-nvidia-job.env
  services:
    - name: docker:24.0.5-dind

build-hiveos-mmpos:
  needs:
    - build-linux-amd64
  stage: wrap
  script:
    - tar -xvf ${LINUX_AMD64_TGZ}
    - mv ./tnn-miner-cpu ./wrappers/hiveos+mmpos/tnn-miner/tnn-miner
    - "[ -d ./tunes ] && cp -r ./tunes ./wrappers/hiveos+mmpos/tnn-miner/tunes || true"
    - sed "s/^EXTERNAL_VERSION=custom/EXTERNAL_VERSION=$PACKAGE_VERSION/g" -i ./wrappers/hiveos+mmpos/tnn-miner/mmp-external.conf
    - chmod +x ./wrappers/hiveos+mmpos/tnn-miner/tnn-miner
    - chmod +x ./wrappers/hiveos+mmpos/tnn-miner/h-run.sh
    - chmod +x ./wrappers/hiveos+mmpos/tnn-miner/h-stats.sh
    - chmod +x ./wrappers/hiveos+mmpos/tnn-miner/mmp-stats.sh
    - chmod +x ./wrappers/hiveos+mmpos/tnn-miner/mmp-launch.sh
    - tar -czvf ${HIVEOS_MMPOS_AMD64_TGZ} -C ./wrappers/hiveos+mmpos/ tnn-miner
  after_script:
    - echo "HIVEOS_MMPOS_BUILD_JOB_ID=$CI_JOB_ID" >> hiveos-job.env
  artifacts:
    name: ${HIVEOS_MMPOS_AMD64_TGZ}
    paths:
      - ${HIVEOS_MMPOS_AMD64_TGZ}
      # depending on your build setup it's most likely a good idea to cache outputs to reduce the build time
      # cache:
      #   paths:
    reports:
      dotenv: hiveos-job.env

build-hiveos-mmpos-amd:
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
  needs:
    - build-linux-amd64-hip-amd
  stage: wrap
  script:
    - tar -xvf ${LINUX_HIP_AMD_TGZ}
    - mv ./tnn-miner-rocm ./wrappers/hiveos+mmpos-amd/tnn-miner-rocm/tnn-miner-rocm
    - "[ -d ./tunes ] && cp -r ./tunes ./wrappers/hiveos+mmpos-amd/tnn-miner-rocm/tunes || true"
    - sed "s/^EXTERNAL_VERSION=custom/EXTERNAL_VERSION=$PACKAGE_VERSION/g" -i ./wrappers/hiveos+mmpos-amd/tnn-miner-rocm/mmp-external.conf
    - chmod +x ./wrappers/hiveos+mmpos-amd/tnn-miner-rocm/tnn-miner-rocm
    - chmod +x ./wrappers/hiveos+mmpos-amd/tnn-miner-rocm/h-run.sh
    - chmod +x ./wrappers/hiveos+mmpos-amd/tnn-miner-rocm/h-stats.sh
    - chmod +x ./wrappers/hiveos+mmpos-amd/tnn-miner-rocm/mmp-stats.sh
    - chmod +x ./wrappers/hiveos+mmpos-amd/tnn-miner-rocm/mmp-launch.sh
    - tar -czvf ${HIVEOS_MMPOS_HIP_AMD_TGZ} -C ./wrappers/hiveos+mmpos-amd/ tnn-miner-rocm
  after_script:
    - echo "HIVEOS_MMPOS_HIP_AMD_BUILD_JOB_ID=$CI_JOB_ID" >> hiveos-hip-amd-job.env
  artifacts:
    name: ${HIVEOS_MMPOS_HIP_AMD_TGZ}
    paths:
      - ${HIVEOS_MMPOS_HIP_AMD_TGZ}
    reports:
      dotenv: hiveos-hip-amd-job.env

build-hiveos-mmpos-nvidia:
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
  needs:
    - build-linux-amd64-hip-nvidia
  stage: wrap
  script:
    - tar -xvf ${LINUX_HIP_NVIDIA_TGZ}
    - mv ./tnn-miner-cuda ./wrappers/hiveos+mmpos-nvidia/tnn-miner-cuda/tnn-miner-cuda
    - "[ -d ./tunes ] && cp -r ./tunes ./wrappers/hiveos+mmpos-nvidia/tnn-miner-cuda/tunes || true"
    - "[ -d ./nvrtc_libs ] && cp ./nvrtc_libs/*.so* ./wrappers/hiveos+mmpos-nvidia/tnn-miner-cuda/ || true"
    - sed "s/^EXTERNAL_VERSION=custom/EXTERNAL_VERSION=$PACKAGE_VERSION/g" -i ./wrappers/hiveos+mmpos-nvidia/tnn-miner-cuda/mmp-external.conf
    - chmod +x ./wrappers/hiveos+mmpos-nvidia/tnn-miner-cuda/tnn-miner-cuda
    - chmod +x ./wrappers/hiveos+mmpos-nvidia/tnn-miner-cuda/h-run.sh
    - chmod +x ./wrappers/hiveos+mmpos-nvidia/tnn-miner-cuda/h-stats.sh
    - chmod +x ./wrappers/hiveos+mmpos-nvidia/tnn-miner-cuda/mmp-stats.sh
    - chmod +x ./wrappers/hiveos+mmpos-nvidia/tnn-miner-cuda/mmp-launch.sh
    - tar -czvf ${HIVEOS_MMPOS_HIP_NVIDIA_TGZ} -C ./wrappers/hiveos+mmpos-nvidia/ tnn-miner-cuda
  after_script:
    - echo "HIVEOS_MMPOS_HIP_NVIDIA_BUILD_JOB_ID=$CI_JOB_ID" >> hiveos-hip-nvidia-job.env
  artifacts:
    name: ${HIVEOS_MMPOS_HIP_NVIDIA_TGZ}
    paths:
      - ${HIVEOS_MMPOS_HIP_NVIDIA_TGZ}
    reports:
      dotenv: hiveos-hip-nvidia-job.env

build-windows:
  rules:
    - if: $CI_COMMIT_TAG || $TNN_BUILD_WIN == "true" || ($CI_COMMIT_MESSAGE =~ /windows\|Windows/)                # Run this job when a tag is created
  extends:
    - .windows_job
  stage: build
  script:
    - echo "running scripts in the build job"
    - $PSVersionTable.PSVersion
    - .\scripts\prereqs.bat ci
    - .\scripts\build.ps1 $PACKAGE_VERSION
    - dir .\build\
    - dir .\build\bin\
    - move build\bin\tnn-miner-cpu.exe .\
    - if (Test-Path .\build\bin\tunes) { Copy-Item -Recurse .\build\bin\tunes .\tunes }
    - Compress-Archive -Path tnn-miner-cpu.exe,tunes -DestinationPath ${WIN_AMD64_ZIP}
    #- 7z.exe a ${WIN_AMD64_ZIP} tnn-miner-cpu.exe
  after_script:
    - echo "WIN_BUILD_JOB_ID=$CI_JOB_ID" >> win-job.env
  artifacts:
    name: ${WIN_AMD64_ZIP}
    paths:
      - ${WIN_AMD64_ZIP}
    reports:
      dotenv: win-job.env


