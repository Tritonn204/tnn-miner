# https://stackoverflow.com/a/67583488
release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-linux-amd64
      artifacts: true
    - job: build-linux-aarch64
      artifacts: true
    - job: build-macos-aarch64
      artifacts: true
    - job: build-hiveos-mmpos
      artifacts: true
    - job: build-windows
      artifacts: true
    - job: build-linux-amd64-hip-amd
      artifacts: true
      optional: true
    - job: build-linux-amd64-hip-nvidia
      artifacts: true
      optional: true
    - job: build-hiveos-mmpos-amd
      artifacts: true
      optional: true
    - job: build-hiveos-mmpos-nvidia
      artifacts: true
      optional: true
    #- job: build-windows-hip-amd
    #  artifacts: true
    #  optional: true
    #- job: build-windows-hip-nvidia
    #  artifacts: true
    #  optional: true
    #- job: build-macos
    #  artifacts: true
  rules:
    - if: $CI_COMMIT_TAG                 # Run this job when a tag is created
  script:
