name: Build Tnn-miner

on:
  push:
    branches:
    - '*'
    tags:
      - "v*.*.*"

jobs:
  # ---- Orochi (unified GPU) builds ----

  linux-orochi:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: 'Setup pre-reqs'
      run: |
        chmod +x ./scripts/prereqs.sh
        ./scripts/prereqs.sh
    - name: 'Build Orochi'
      run: |
        chmod +x ./scripts/build_all.sh
        ./scripts/build_all.sh ${GITHUB_REF_NAME} orochi
    - name: 'Package'
      run: |
        cd hip-build/linux/orochi
        tar -czvf ../../../tnn-miner-linux-x86_64.tar.gz tnn-miner tunes/
    - name: 'Upload artifact'
      uses: actions/upload-artifact@v4
      with:
        name: tnn-miner-linux-x86_64
        path: tnn-miner-linux-x86_64.tar.gz
        retention-days: 5
    - name: 'Release'
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        make_latest: "true"
        files: |
          tnn-miner-linux-x86_64.tar.gz

  windows-orochi:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: 'Setup pre-reqs'
      shell: cmd
      run: |
        scripts\prereqs.bat ci
    - name: 'Build Orochi'
      shell: pwsh
      run: |
        $env:PATH = "C:\mingw64\bin;" + $env:PATH
        .\scripts\build_all.ps1 $env:GITHUB_REF_NAME orochi
    - name: 'Package'
      shell: pwsh
      run: |
        cd hip-build\win32\orochi
        Compress-Archive -Path tnn-miner.exe, tunes\ -DestinationPath ..\..\..\tnn-miner-windows-x86_64.zip
    - name: 'Upload artifact'
      uses: actions/upload-artifact@v4
      with:
        name: tnn-miner-windows-x86_64
        path: tnn-miner-windows-x86_64.zip
        retention-days: 5
    - name: 'Release'
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        make_latest: "true"
        files: |
          tnn-miner-windows-x86_64.zip

